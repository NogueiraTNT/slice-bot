[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sally-cibote"
version = "0.1.0"
description = "Sally Cibote — voz natural local + cérebro Ollama remoto (VPS)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Daniel" }]
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
voice = [
  "sounddevice>=0.5",
  "numpy>=1.26",
  "pyttsx3>=2.90",
  "edge-tts>=6.1",
  "pygame>=2.5",
  "faster-whisper>=1.0",
  "pipecat-ai[whisper,silero]>=0.0.68",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
sally-cibote = "sally_cibote.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
